# main への push、microCMS の Webhook（repository_dispatch）、手動実行でビルド & デプロイする
name: Deploy

on:
  push:
    branches: [main]
  # microCMS のカスタム通知（Webhook）から GitHub API 経由で叩く
  # POST /repos/{owner}/{repo}/dispatches  body: {"event_type": "microcms_publish"}
  repository_dispatch:
    types: [microcms_publish]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          # Cloudflare Web Analytics のビーコン。本番デプロイのみに設定する
          # （プレビュー環境の数値を本番に混ぜないため preview-pages.yml には渡さない）
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.PUBLIC_CF_BEACON_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
